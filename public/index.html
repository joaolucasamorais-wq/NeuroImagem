<script>
"use strict";
const chapterNames = [
    'Introdução à Neurorradiologia', 'Física da Tomografia Computadorizada', 'Física da Ressonância Magnética', 'Física da Angiografia e dos Contrastes', 'Protocolos, Qualidade de Imagem e Segurança',
    'Anatomia Cerebral Axial', 'Anatomia Cerebral Coronal e Sagital', 'Tronco Encefálico e Cerebelo', 'Anatomia Vascular Cerebral', 'Coluna, Medula e Nervos',
    'TC de Crânio Normal', 'Hemorragias Intracranianas', 'Isquemia e Alterações Vasculares na TC', 'Trauma Cranioencefálico', 'Lesões Expansivas, Edema e Hidrocefalia',
    'RM T1 e T2', 'FLAIR e STIR', 'DWI e ADC', 'GRE, T2*, SWI e QSM', 'RM com Contraste',
    'Perfusão por TC', 'Perfusão por RM', 'Espectroscopia por RM', 'DTI e Tractografia', 'RM Funcional, Conectividade e Técnicas Emergentes',
    'AVC Isquêmico Agudo', 'Doenças dos Grandes e Pequenos Vasos', 'Hemorragia Intracerebral e HSA', 'Trombose Venosa e Malformações Vasculares', 'Angiografia e Neurointervenção',
    'Esclerose Múltipla', 'NMOSD, MOGAD e Outras Doenças Inflamatórias', 'Encefalites e Infecções do SNC', 'Neuroimagem das Epilepsias', 'Doenças Autoimunes e Encefalopatias',
    'Doença de Alzheimer e Comprometimento Cognitivo', 'Demências Frontotemporais e Outras Demências', 'Parkinsonismo e Síndromes Atípicas', 'Hidrocefalia de Pressão Normal e Distúrbios Liquóricos', 'Ataxias e Doenças Neurodegenerativas Raras',
    'Neuroimagem Neonatal', 'Malformações do Desenvolvimento Cortical', 'Leucodistrofias e Doenças Metabólicas', 'Doenças Mitocondriais e Genéticas', 'Neuroimagem Pediátrica Avançada',
    'Tumores Primários do Sistema Nervoso', 'Metástases, Linfoma e Outras Lesões Expansivas', 'Coluna e Medula Espinal', 'Interpretação Sistemática e Elaboração de Laudos', 'Neurorradiologia Integrada Avançada'
];
const axes = ['Fundamentos de imagem', 'Neuroanatomia radiológica', 'Tomografia computadorizada', 'Ressonância magnética', 'Técnicas avançadas', 'Neurologia vascular', 'Inflamação, infecção e epilepsia', 'Neurodegeneração e movimento', 'Pediatria, genética e metabolismo', 'Neuro-oncologia, medula e integração'];
const chapterId = (n) => String(n + 1).padStart(2, '0');
const lessons = [
    { id: '01', title: chapterNames[0], axis: axes[0], duration: 18, intro: 'O objetivo da neurorradiologia não é apenas reconhecer uma imagem: é responder a uma pergunta clínica com uma modalidade apropriada e saber onde a imagem não pode responder.', topics: [
            { heading: 'A pergunta precede o exame', body: 'Defina síndrome, início dos sintomas, topografia suspeita, urgência, contraindicações e hipóteses que a imagem pode discriminar. O mesmo achado pode ter significados diferentes em pacientes com histórias distintas.' },
            { heading: 'Modalidade e trade-offs', body: 'A TC é rápida e especialmente útil em cenários de urgência, hemorragia aguda, osso e calcificações. A RM oferece maior contraste de tecidos moles e diferentes mecanismos de contraste, mas exige avaliação de segurança, disponibilidade, tempo e suscetibilidade a movimento.' },
            { heading: 'Método de leitura', body: 'Confirme paciente, modalidade, região, data, qualidade técnica, orientação e sequências. Siga um roteiro anatômico reprodutível, descreva achados observáveis e estabeleça hipóteses proporcionais à evidência. Reconheça limitações do exame.' },
            { heading: 'Correlação clínica', body: 'Não transforme um sinal inespecífico em diagnóstico definitivo. Considere o contexto e a probabilidade pré-teste. Resultados de imagem devem dialogar com exame clínico, laboratório e evolução temporal.' }
        ],
        pearl: 'Achado de imagem ≠ diagnóstico isolado. A interpretação precisa de contexto e qualidade técnica.',
        question: 'Qual é a primeira etapa de uma interpretação radiológica segura?', answers: ['Definir o diagnóstico pela imagem mais vistosa', 'Verificar a pergunta clínica, identificação e adequação técnica', 'Assumir que exames sem contraste não têm utilidade'], correct: 1, why: 'Uma leitura fundamentada começa pelo contexto e pela checagem do estudo antes das conclusões.', refs: ['ACR Appropriateness Criteria', 'DICOM Standard — NEMA'] },
    { id: '02', title: chapterNames[1], axis: axes[0], duration: 24, intro: 'Na tomografia, a intensidade do voxel reflete a atenuação de raios X. Entender o sinal físico é essencial para não confundir tecido, artefato e patologia.', topics: [
            { heading: 'Atenuação e unidades Hounsfield', body: 'Os valores de TC são normalizados em relação à água (aproximadamente 0 HU) e ao ar (aproximadamente −1000 HU). Materiais densos, como osso cortical, têm valores geralmente mais altos; os valores são influenciados por técnica e energia do feixe.' },
            { heading: 'Janela e nível', body: 'Window width (WW) controla a faixa de atenuações mapeada em cinza; window level (WL), o seu centro. Janelas cerebral, óssea e subdural destacam informações diferentes, sem alterar a aquisição original.' },
            { heading: 'Reconstruções e voxel', body: 'Espessura de corte, kernel de reconstrução, pixel spacing e orientação influenciam nitidez, ruído, artefatos e medidas. Reconstruções em outros planos exigem dados volumétricos adequados.' },
            { heading: 'Artefatos e dose', body: 'Endurecimento do feixe, movimento, materiais metálicos e volume parcial podem criar falsas alterações. Dose e qualidade devem ser equilibradas mediante protocolos apropriados ao contexto e ao paciente.' }
        ],
        pearl: 'A janela muda a apresentação dos valores — não cria informação que não foi adquirida.',
        question: 'O ajuste de janela de uma TC modifica diretamente...', answers: ['A exposição do paciente à radiação após o exame', 'A representação visual das atenuações já adquiridas', 'A posição anatômica original dos voxels'], correct: 1, why: 'WW e WL são operações de visualização aplicadas aos dados; não repetem a aquisição.', refs: ['DICOM Standard — Pixel Data', 'ACR–AAPM technical parameters (consulta por versão)'] },
    { id: '03', title: chapterNames[2], axis: axes[0], duration: 26, intro: 'RM utiliza propriedades magnéticas dos núcleos e manipulação de pulsos de radiofrequência e gradientes para produzir contraste e informação espacial.', topics: [
            { heading: 'Magnetização e ressonância', body: 'Sob um campo estático B0, spins nucleares apresentam comportamento coletivo. Pulsos de RF alteram a magnetização, e gradientes permitem codificação espacial. A frequência de precessão depende do campo.' },
            { heading: 'T1, T2 e densidade de prótons', body: 'T1 descreve recuperação da magnetização longitudinal; T2 descreve perda de coerência transversal por interações microscópicas. Parâmetros de aquisição mudam a ponderação e o contraste observado.' },
            { heading: 'TR, TE e sequências', body: 'Tempo de repetição (TR) e tempo de eco (TE), entre vários parâmetros, influenciam ponderação e sinal. Características variam conforme sequência, campo, fabricantes e técnica, evitando regras absolutas de aparência.' },
            { heading: 'Artefatos e segurança', body: 'Movimento, susceptibilidade, aliasing, fluxo e heterogeneidade do campo podem imitar alterações. Triagem de implantes, dispositivos e condições específicas precede a realização da RM.' }
        ],
        pearl: 'Sinal alto em T2 não é sinônimo de uma patologia específica; depende da sequência e do contexto.',
        question: 'Qual alternativa descreve melhor o T2?', answers: ['Tempo de recuperação longitudinal', 'Decaimento da coerência transversal', 'Medida direta de atenuação por raios X'], correct: 1, why: 'T2 representa o relaxamento transversal; T1 refere-se à recuperação longitudinal.', refs: ['ACR Manual on MR Safety', 'Textos de física de RM — referência editorial a confirmar'] },
    { id: '04', title: chapterNames[3], axis: axes[0], duration: 22, intro: 'Angioimagem é um conjunto de técnicas distintas. O tipo de aquisição define o que pode e o que não pode ser inferido sobre um vaso.', topics: [
            { heading: 'Angiografia por subtração digital', body: 'A DSA utiliza aquisição temporal e subtração para visualizar opacificação vascular; é invasiva e envolve contraste iodado e radiação. A interpretação depende de projeção, fluxo e fase do estudo.' },
            { heading: 'Angio-TC e angio-RM', body: 'A angio-TC demonstra vasos após aquisição tomográfica apropriada, usualmente com contraste iodado. Angio-RM pode utilizar técnicas sem contraste, como TOF, ou técnicas contrastadas, com limitações próprias de fluxo.' },
            { heading: 'Contrastes e segurança', body: 'Contrastes iodados e agentes à base de gadolínio não são intercambiáveis. Avaliam-se indicação, histórico de reações, função renal quando aplicável, características do produto e protocolos locais vigentes.' },
            { heading: 'Pseudolesões e técnica', body: 'Timing inadequado de bolo, turbulência, fluxo lento, artefatos por movimento e subtração incompleta podem sugerir estenoses ou oclusões artificiais. Considere imagens fonte e reconstruções.' }
        ],
        pearl: 'MIP e renderização vascular facilitam a navegação, mas nunca substituem a avaliação das imagens fonte.',
        question: 'Qual afirmação está correta?', answers: ['Toda angio-RM precisa de gadolínio', 'TOF pode permitir angio-RM sem contraste exógeno', 'MIP adiciona informação ausente dos cortes originais'], correct: 1, why: 'Técnicas TOF dependem de propriedades relacionadas ao fluxo e podem ser feitas sem contraste exógeno.', refs: ['ACR Manual on Contrast Media', 'DICOM Standard — angiographic image modules'] },
    { id: '05', title: chapterNames[4], axis: axes[0], duration: 25, intro: 'Um estudo tecnicamente inadequado pode ser perigoso quando recebe uma conclusão excessivamente confiante. Segurança e qualidade fazem parte da interpretação.', topics: [
            { heading: 'Adequação da indicação', body: 'Escolha protocolo conforme hipótese e situação clínica, evitando aquisição desnecessária. Examine urgência, condição do paciente, uso de contraste, necessidade de sedação e disponibilidade local.' },
            { heading: 'Checklist da aquisição', body: 'Verifique modalidade, região, cobertura anatômica, lateralidade, espessura, orientação, artefatos, sequências previstas e adequação de contraste. Identifique cortes faltantes ou degradação de qualidade.' },
            { heading: 'Segurança em RM', body: 'A avaliação de dispositivos implantáveis deve considerar a condição de compatibilidade MR, modelo e restrições especificadas. O ambiente magnético impõe riscos que exigem triagem formal e equipe treinada.' },
            { heading: 'Confiança e comunicação', body: 'Relate explicitamente limitações que prejudiquem a leitura e comunique achados críticos pelos fluxos institucionais. Não oculte incertezas relevantes nem transforme a ausência de visualização em ausência de doença.' }
        ],
        pearl: 'Quando a qualidade não permite responder à pergunta clínica, a limitação deve constar da conclusão.',
        question: 'Qual conduta melhora a confiabilidade da interpretação?', answers: ['Ignorar artefatos quando a hipótese é forte', 'Documentar limitações técnicas relevantes', 'Assumir ausência de lesão se uma sequência estiver ausente'], correct: 1, why: 'A conclusão deve refletir a qualidade, cobertura e limitações do estudo.', refs: ['ACR Manual on MR Safety', 'ACR Manual on Contrast Media', 'DICOM Standard — Patient Orientation'] }
];
